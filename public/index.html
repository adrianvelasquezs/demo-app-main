<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo App Tests</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Pruebas de DB y S3</h1>
        <p>
          Guarda notas en la base de datos y archivos de texto en S3 desde esta
          interfaz.
        </p>

        <div class="actions-grid">
          <section class="panel">
            <h2>DB: Notas</h2>
            <label for="dbNoteInput">Texto de la nota</label>
            <input
              id="dbNoteInput"
              type="text"
              maxlength="255"
              placeholder="Ej. Nota creada desde frontend"
            />

            <div class="buttons">
              <button id="dbCreateBtn">Guardar Nota</button>
              <button id="dbListBtn">Listar Notas</button>
            </div>

            <div class="pager" aria-label="Paginacion de notas">
              <button id="dbPrevBtn" type="button">Anterior</button>
              <span id="dbPageInfo" class="pager-info">Pagina 1</span>
              <button id="dbNextBtn" type="button">Siguiente</button>
            </div>

            <div class="list-box">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nota</th>
                    <th>Fecha</th>
                  </tr>
                </thead>
                <tbody id="dbListBody">
                  <tr>
                    <td colspan="3" class="empty">Sin datos aun.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <h2>S3: Archivos</h2>
            <label for="s3FileNameInput">Nombre de archivo</label>
            <input id="s3FileNameInput" type="text" placeholder="nota.txt" />

            <label for="s3ContentInput">Contenido</label>
            <textarea
              id="s3ContentInput"
              rows="4"
              placeholder="Texto que se guardara en S3"
            ></textarea>

            <div class="buttons">
              <button id="s3UploadBtn">Subir a S3</button>
              <button id="s3ListBtn">Listar Objetos</button>
            </div>

            <div class="pager" aria-label="Paginacion de objetos S3">
              <button id="s3PrevBtn" type="button">Anterior</button>
              <span id="s3PageInfo" class="pager-info">Pagina 1</span>
              <button id="s3NextBtn" type="button">Siguiente</button>
            </div>

            <ul id="s3List" class="object-list">
              <li class="empty">Sin datos aun.</li>
            </ul>
          </section>
        </div>

        <div id="status" class="status">Listo para ejecutar pruebas.</div>
        <pre id="output">Esperando respuesta...</pre>
      </section>
    </main>

    <script src="/ui.js"></script>
  </body>
</html>
